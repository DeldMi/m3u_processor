name: Apply observability architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[observability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install 'psutil>=7.2.2'
      - name: Apply changes
        run: python scripts/apply_observability.py
      - name: Validate Python
        run: python -m compileall -q src tests && python -m unittest discover -s tests -v
      - name: Build frontend
        run: npm --prefix frontend/react install && npm --prefix frontend/react run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src frontend/react requirements.txt tests
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "feat: observability dashboard and controlled publication [observability-applied]"
          git push
      - name: Remove bootstrap workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-observability.yml
          git add .github/workflows/apply-observability.yml
          git commit -m "chore(ci): remove observability bootstrap workflow [observability-applied]" || true
          git push || true
