name: Diagnose frontend build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend/react
        run: npm install
      - name: Build diagnostic
        working-directory: frontend/react
        run: |
          set +e
          npm run build > ../../frontend-build-diagnostic.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> ../../frontend-build-diagnostic.log
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-build-diagnostic.log
          git commit -m 'chore: frontend build diagnostic [skip ci]' || true
          git push || true
