name: repair-login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair login guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if user and user["active"] if "active" in user.keys() else user:\n                if user and check_password_hash(user["password_hash"], password):\n                    login_user(dict(user))\n                    return redirect(url_for("view_dashboard"))'''
          new = '''            if user is not None:\n                keys = user.keys()\n                is_active = bool(user["active"]) if "active" in keys else True\n                password_hash = user["password_hash"] if "password_hash" in keys else ""\n                if is_active and password_hash and check_password_hash(password_hash, password):\n                    login_user(dict(user))\n                    return redirect(url_for("view_dashboard"))'''
          if old not in text:
              raise SystemExit('login block not found; refusing unsafe modification')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m compileall -q src tests

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(auth): handle missing user during login"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm -f .github/workflows/repair-login.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary login repair workflow" || true
          git push || true
