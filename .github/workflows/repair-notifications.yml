name: Repair notification architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete app and patch notifications
        env:
          BASE_COMMIT: bc90f28cbe2b3f9cdd6374e0d262c44b8b08fee2
        run: |
          git checkout "$BASE_COMMIT" -- src/app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.py')
          s = p.read_text()
          s = s.replace('import re\nfrom collections', 'import re\nimport uuid\nfrom collections')
          s = s.replace('def add_process_log(message: str, level: str = "info", run_id=None):\n', '''def add_notification(level: str, title: str, message: str, source: str = "Execução", path: str = "", details: str = ""):\n    NOTIFICATIONS.appendleft({\n        "id": uuid.uuid4().hex,\n        "level": level,\n        "title": title,\n        "message": message,\n        "timestamp": datetime.now().isoformat(timespec="seconds"),\n        "source": source,\n        "path": path,\n        "details": details,\n    })\n\n\ndef add_process_log(message: str, level: str = "info", run_id=None):\n''')
          s = s.replace('        NOTIFICATIONS.appendleft({"level": level, "title": "Execução", "message": message, "timestamp": timestamp})', '        source = "Health Check" if any(token in message.lower() for token in ("health check", "verificação de canais", "internet")) else "Execução"\n        add_notification(level, "Health Check" if source == "Health Check" else "Execução", message, source=source, path="/" if source == "Execução" else "/api/v1/health")')
          s = s.replace('register_monitoring_routes(app, manager, PROCESS_STATE, PROCESS_LOGS, NOTIFICATIONS, RESOURCE_MONITOR)', 'register_monitoring_routes(app, manager, PROCESS_STATE, PROCESS_LOGS, NOTIFICATIONS, RESOURCE_MONITOR, add_notification=add_notification)')
          p.write_text(s)

          p = Path('src/domains/monitoring/routes.py')
          s = p.read_text()
          s = s.replace('def register_monitoring_routes(app, manager, process_state, process_logs, notifications, monitor: ResourceMonitor):', 'def register_monitoring_routes(app, manager, process_state, process_logs, notifications, monitor: ResourceMonitor, add_notification=None):')
          s = s.replace('        notifications.append({"level": "success", "title": "Memória limpa", "message": f"Coleta executada: {result[\'collected_objects\']} objetos.", "timestamp": datetime.now().isoformat(timespec="seconds")})', '        notice = add_notification or (lambda level, title, message, source="Execução", path="", details="": notifications.append({"id": f"{datetime.now().timestamp()}-memory", "level": level, "title": title, "message": message, "timestamp": datetime.now().isoformat(timespec="seconds"), "source": source, "path": path, "details": details}))\n        notice("success", "Memória limpa", f"Coleta executada: {result[\'collected_objects\']} objetos.", source="Manutenção", path="/settings/resources")')
          start = '    notice_state = {"key": ""}\n'
          s = s.replace(start, '')
          old = '''        last_log = str(process_state.get("ultimo_log") or "").strip()\n        key = f"{process_state.get('status')}|{last_log}"\n        if last_log and key != notice_state["key"]:\n            notice_state["key"] = key\n            offline = process_state.get("internet_online") is False and "Internet" in last_log\n            level = "warning" if offline else ("error" if process_state.get("status") == "Erro" else "success")\n            notifications.append({"level": level, "title": "Health Check" if offline or "Saúde" in last_log else "Execução", "message": last_log, "timestamp": datetime.now().isoformat(timespec="seconds")})\n        return jsonify(list(notifications))'''
          s = s.replace(old, '        return jsonify(list(notifications))')
          p.write_text(s)
          PY

      - name: Verify Python syntax
        run: python -m compileall -q src tests

      - name: Commit repaired backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.py src/domains/monitoring/routes.py
          git diff --cached --quiet || git commit -m 'fix: stabilize notification events [skip ci]'
          git push
