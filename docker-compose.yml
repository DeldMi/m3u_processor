version: '3.8'

services:
  m3u-processor:
    build: .
    container_name: m3u_processor_node
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "5000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.env:/app/.env
  m3u-public:
    build: .
    container_name: m3u_processor_public
    restart: unless-stopped
    command: [ "python", "-m", "src.public_server" ]
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      PUBLIC_ONLY: "1"
      PUBLIC_HOST: "0.0.0.0"
      PUBLIC_PORT: "8080"
    volumes:
      - ./output:/app/output:ro
      - ./.env:/app/.env:ro
