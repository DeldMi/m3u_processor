version: '3.8'

services:
  m3u-processor:
    build: .
    container_name: m3u_processor_node
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "5000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.env:/app/.env
