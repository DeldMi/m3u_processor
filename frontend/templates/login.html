<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - M3U Architect</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-box { max-width: 380px; margin: 100px auto; background: var(--bg-card); padding: 32px; border-radius: 8px; border: 1px solid var(--border); }
        .login-box h2 { text-align: center; color: var(--accent); margin-top: 0; }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--offline); color: var(--offline); padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; }
        .btn-full { width: 100%; margin-top: 10px; padding: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>M3U ARCHITECT</h2>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px;">Usuário</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px;">Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-full">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
